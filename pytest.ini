[pytest]
# Pytest configuration for OBS_bot Tier 1 testing
#
# Coverage floor: the old target was 80%, but the suite measured 51% on 5 Nov 2026
# (main.py, startup_validator, stream_manager, owner_detector and health_monitor have no
# tests that run without a live OBS). The floor is set just under the measured figure so a
# drop fails the build; raise it as tests are added.

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Async support (required for asyncio services)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=50

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires OBS running)
    requires_obs: Needs a live OBS websocket (always used together with integration)
    contract: Contract tests (API endpoint validation)
    slow: Slow-running tests
    performance: Timing measurements against a live OBS (always used together with integration)

# Logging during tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__init__.py

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
